<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"content="Bievenue sur DisHub, le site de partage de recette collaboratif" />
    <title>DisHub</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    
    <main>

        <div id="wrapper_connexion" class="wrapper_connexion">
            <div class="form_wrapper sign_up">
                <form>
                    <h1>Sign Up</h1>
                    <div class="sign_reseau">
                        <a href="#" class="link_reseau"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="link_reseau"><i class="fab fa-google-plus-g"></i></a>
                        <a href="#" class="link_reseau"><i class="fa-brands fa-instagram"></i></a>
                    </div>
                    <p>or use your email for registration</p>
                    <input type="text" id="signup_name" name="signup_name" placeholder="Name" aria-label="input pour le nom" />
                    <input type="email" id="signup_email" name="signup_email" placeholder="Email" aria-label="input pour l'email" />
                    <input type="password" id="signup_pwd" name="signup_pwd" placeholder="Password" aria-label="input pour le mot de passe" />
                    <input type="password" id="signup_confirm_pwd" name="signup_confirm_pwd" placeholder="Confirm your password" aria-label="input pour confirmer le mot de passe" />
                    <button class="btn_sign" aria-label="bouton inscription">Sign Up</button>
                </form>
                
            </div>
            <div class="form_wrapper sign_in">
                <form>
                    <h1>Sign in</h1>
                    <div class="sign_reseau">
                        <a href="#" class="link_reseau"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="link_reseau"><i class="fab fa-google-plus-g"></i></a>
                        <a href="#" class="link_reseau"><i class="fa-brands fa-instagram"></i></a>
                    </div>
                    <p>or use your account</p>
                    <input type="email" id="signin_email" name="signin_email" placeholder="Email" aria-label="input pour email"/>
                    <input type="password" id="signin_pwd" name="signin_pwd" placeholder="Password" aria-label="input pour mdp"/>
                    <a href="#">Forgot your password?</a>
                    <button class="btn_sign" aria-label="bouton connexion">Sign In</button>
                </form>
            </div>
            <div class="overlay_wrapper">
                <div class="overlay">
                    <div class="overlay_panel overlay_left">
                        <h1>Welcome Back!</h1>
                        <p>To keep connected with us please login with your personal info</p>
                        <button id="showSignIn" class="overlay_btn" type="button">Sign In</button>
                    </div>
                    <div class="overlay_panel overlay_right">
                        <h1>Hello, Friend!</h1>
                        <p>Enter your personal details and start journey with us</p>
                        <button id="showSignUp" class="overlay_btn" type="button">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>

    </main>


    <script src="../assets/js/main.js"></script>
    <script src="https://kit.fontawesome.com/c970b44775.js" crossorigin="anonymous"></script>
</body>
</html>
