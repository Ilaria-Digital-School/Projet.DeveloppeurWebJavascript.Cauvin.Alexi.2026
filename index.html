<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    

    <header>

        <!-- décoration image top -->

        <div class="deco_img_header">
            <img src="img/header_ellipse.png" alt="Ellipse">
            <img src="img/header_ellipse_deux.png" alt="Ellipse">
        </div>

        <!-- Menu -->

        <nav>
            <div class="nav_link">
                <img src="img/logo_dishub.png" alt="logo DisHub">
                <a href="">Home</a>
                <a href="">Recipe</a>
                <a href="">Search</a>
                <a href="">Contact</a>
            </div>
            <div class="nav_interact">
                <search>
                    <form>
                        <input type="search" id="nav_search" name="nav_search" placeholder="Research ..."/>
                        <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </form>
                </search>
                <div class="nav_sign">
                    <a href="">Sign In</a>
                </div>
                <div class="nav_sign">
                    <a href="">Sign Up</a>
                </div>
                <div class="nav_user_connected hidden">
                    <a href="">
                        <p>username</p>
                        <img src="" alt="profile picture">
                    </a>
                </div>
            </div>
        </nav>

    </header>

    <main>

        <!-- section accueil -->

        <section id="accueil" class="accueil">

            <div class="img_accueil">
                <div class="img_wrapper">
                    <img src="img/img_plat_accueil.png" alt="image plat dishbub">
                    <div class="img_accueil_text">
                        <h1>Are you hungry ?<br>Let's start Cooking</h1>
                        <p>
                            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas ac aliquet nibh. Nunc nunc nunc, sagittis ac mattis at, tincidunt id metus.
                        </p>
                        <div class="btn_sign">
                            <a href="">Sign Up</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="element_scroll">
                <a href="">Scroll <br/> <i class="fa-solid fa-arrow-down"></i></a>
            </div>

        </section>

        <!-- -->

    </main>


    <script src="js/main.js"></script>
    <script src="https://kit.fontawesome.com/c970b44775.js" crossorigin="anonymous"></script>
</body>
</html>
