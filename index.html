<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <header>

        <!-- Menu -->

        <nav>
            <div class="nav_link">
                <img src="img/logo_dishub.png" alt="logo DisHub">
                <a href="">Home</a>
                <a href="">Recipe</a>
                <a href="">Search</a>
                <a href="">Contact</a>
            </div>
            <div class="nav_interact">
                <search>
                    <form>
                        <input type="search" id="nav_search" name="nav_search" placeholder="Research ..."/>
                        <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </form>
                </search>
                <div class="nav_sign">
                    <a href="">Sign In</a>
                </div>
                <div class="nav_sign">
                    <a href="">Sign Up</a>
                </div>
                <div class="nav_user_connected hidden">
                    <a href="">
                        <p>username</p>
                        <img src="" alt="profile picture">
                    </a>
                </div>
            </div>
        </nav>

    </header>



    <script src="js/main.js"></script>
    <script src="https://kit.fontawesome.com/c970b44775.js" crossorigin="anonymous"></script>
</body>
</html>
